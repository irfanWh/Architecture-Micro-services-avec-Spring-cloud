spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: customers-static
              uri: http://localhost:8081
              predicates:
                - Path=/customers/**
            - id: products-static
              uri: http://localhost:8082
              predicates:
                - Path=/products/**
            - id: bills-static
              uri: http://localhost:8083
              predicates:
                - Path=/bills/**
