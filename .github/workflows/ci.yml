name: Build and tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - name: End-to-end services
        run: |
          python3 scripts/services.py start
          python3 scripts/smoke.py
      - name: Stop services
        if: always()
        run: python3 scripts/services.py stop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: service-logs
          path: logs/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: angular-client/package-lock.json
      - run: npm ci
      - run: npm run build
